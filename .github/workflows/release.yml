name: Release plugin

# Publishing a GitHub release builds the plugin zip and attaches it to the release. A normal release is also deployed to
# WordPress.org, which needs the repository secrets SVN_USERNAME and SVN_PASSWORD. A pre-release is never deployed: mark
# the release as a pre-release, or use a tag with a hyphen, for example 3.0.0-rc.1.
#
# Run the workflow by hand (Actions > Release plugin > Run workflow) to build a zip of any branch; the zip is attached to
# the run.

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release tag matches the plugin version
        id: version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          header=$(sed -n 's/^[[:space:]]*\*\{0,1\}[[:space:]]*Version:[[:space:]]*//p' related-posts-for-wp.php | head -1 | tr -d '[:space:]')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')
          echo "Tag: $TAG, plugin header: $header, readme stable tag: $stable, marked pre-release: $PRERELEASE"

          if [ "$TAG" != "$header" ]; then
            echo "::error::The release tag and the plugin header Version must be the same."
            exit 1
          fi

          # A tag with a hyphen is a pre-release even when the release is not marked as one, so it never reaches
          # WordPress.org by accident.
          if [ "$PRERELEASE" = "true" ] || [[ "$TAG" == *-* ]]; then
            echo "Pre-release: building the zip only."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$TAG" != "$stable" ]; then
            echo "::error::The release tag and the readme Stable tag must be the same."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The files WordPress.org gets, in a related-posts-for-wp folder, so the zip installs under the right name.
      - name: Build the zip
        id: zip
        run: |
          mkdir -p artifacts/build/related-posts-for-wp
          rsync -a --exclude-from=.distignore ./ artifacts/build/related-posts-for-wp/
          (cd artifacts/build && zip -qr ../related-posts-for-wp.zip related-posts-for-wp)
          echo "path=artifacts/related-posts-for-wp.zip" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        if: steps.version.outputs.deploy == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: related-posts-for-wp

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.zip.outputs.path }}" --clobber

      - name: Attach the zip to the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: related-posts-for-wp-${{ github.sha }}
          path: ${{ steps.zip.outputs.path }}
